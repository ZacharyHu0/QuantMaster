name: Release Desktop Builds

# 打 tag（如 v0.3.0）自动构建 Mac / Windows / Linux 三平台单文件可执行程序
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: QuantMaster.exe
            asset: QuantMaster-windows.exe
          - os: macos-latest
            artifact: QuantMaster
            asset: QuantMaster-macos
          - os: ubuntu-latest
            artifact: QuantMaster
            asset: QuantMaster-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[data]"
          pip install pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller quantmaster.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: mv "packaging/dist/${{ matrix.artifact }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
