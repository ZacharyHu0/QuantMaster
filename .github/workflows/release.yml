name: Release Desktop Builds

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12.13"

jobs:
  validate:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Validate immutable current release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags --force
          target_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$target_commit" origin/main
          app_version="$(python -c 'from quantmaster.release import VERSION; print(VERSION)')"
          test "$RELEASE_TAG" = "v${app_version}"

  build:
    needs: validate
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            artifact: QuantMaster.exe
            asset: QuantMaster-windows.exe
          - os: macos-latest
            artifact: QuantMaster
            asset: QuantMaster-macos
          - os: ubuntu-latest
            artifact: QuantMaster
            asset: QuantMaster-linux
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
      - name: Install locked desktop environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra data --extra tushare --extra rust --extra release
          uv run maturin build --manifest-path rust/quantmaster-kernel/Cargo.toml --release --locked --out .artifacts/native
          uv pip install --no-index --find-links .artifacts/native quantmaster-kernel
      - name: Verify native kernel and application version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c "from quantmaster.research.kernel import kernel_capabilities; assert kernel_capabilities()['backend'] == 'rust'"
          test "$RELEASE_TAG" = "v$(uv run python -c 'from quantmaster import __version__; print(__version__)')"
      - name: Build desktop executable
        run: uv run pyinstaller packaging/quantmaster.spec --noconfirm --distpath .artifacts/packages/desktop --workpath .artifacts/build/pyinstaller
      - name: Enforce desktop artifact policy
        shell: bash
        run: >-
          uv run python scripts/release/check_desktop_artifact.py
          ".artifacts/packages/desktop/${{ matrix.platform.artifact }}"
          --analysis .artifacts/build/pyinstaller/quantmaster/Analysis-00.toc
      - name: Rename artifact
        shell: bash
        run: mv ".artifacts/packages/desktop/${{ matrix.platform.artifact }}" "${{ matrix.platform.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform.asset }}
          path: ${{ matrix.platform.asset }}
          retention-days: 30

  publish:
    needs: [validate, build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: .artifacts/release
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .artifacts/release
          format: cyclonedx-json
          output-file: .artifacts/release/QuantMaster.cdx.json
          syft-version: "v1.50.0"
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        working-directory: .artifacts/release
        run: >-
          sha256sum QuantMaster-linux QuantMaster-macos QuantMaster-windows.exe
          QuantMaster.cdx.json > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: .artifacts/release/*
      - name: Extract current release notes
        shell: bash
        run: |
          awk '/^## v/ { if (found) exit; found=1 } found' CHANGELOG.md > .release-notes.md
          test -s .release-notes.md
      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: .artifacts/release/*
          body_path: .release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
