name: Release Desktop Builds

permissions:
  contents: write

# 打 tag（如 v0.3.0）自动构建 Mac / Windows / Linux 三平台单文件可执行程序
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: QuantMaster.exe
            asset: QuantMaster-windows.exe
          - os: macos-latest
            artifact: QuantMaster
            asset: QuantMaster-macos
          - os: ubuntu-latest
            artifact: QuantMaster
            asset: QuantMaster-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          pip install -e ".[data,tushare,rust]"
          maturin develop --manifest-path rust/quantmaster-kernel/Cargo.toml --release
          pip install pyinstaller
      - name: Verify native research kernel
        run: python -c "from quantmaster.research.kernel import kernel_capabilities; assert kernel_capabilities()['backend'] == 'rust'"
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(python -c 'from quantmaster import __version__; print(__version__)')"
      - name: Build
        working-directory: packaging
        run: pyinstaller quantmaster.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: mv "packaging/dist/${{ matrix.artifact }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          body_path: CHANGELOG.md
