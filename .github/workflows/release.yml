name: Release Desktop Builds

permissions:
  contents: write

# 打 tag（如 v0.3.0）自动构建 Mac / Windows / Linux 三平台单文件可执行程序
on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - ".github/release-backfill.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Historical tag to create or rebuild (for example v0.10.1)"
        required: false
        type: string
      target_sha:
        description: "Full historical commit SHA; must be an ancestor of main"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve, validate, and create release tags
        id: targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          targets_file="$RUNNER_TEMP/release-targets.json"
          normalized_file="$RUNNER_TEMP/release-targets.tsv"
          : > "$normalized_file"

          python - <<'PY' > "$targets_file"
          import json
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          if event == "push" and os.environ["REF_TYPE"] == "tag":
              targets = [{
                  "tag": os.environ["REF_NAME"],
                  "target_sha": os.environ["EVENT_SHA"],
                  "make_latest": True,
              }]
          elif event == "workflow_dispatch":
              tag = os.environ.get("RELEASE_TAG", "").strip()
              target_sha = os.environ.get("TARGET_SHA", "").strip()
              if not tag or not target_sha:
                  raise SystemExit("release_tag and target_sha must be supplied together")
              targets = [{"tag": tag, "target_sha": target_sha, "make_latest": False}]
          else:
              payload = json.loads(
                  Path(".github/release-backfill.json").read_text(encoding="utf-8")
              )
              if payload.get("schema_version") != 1:
                  raise SystemExit("unsupported release backfill schema")
              releases = payload.get("releases")
              if not isinstance(releases, list) or not releases:
                  raise SystemExit("release backfill list must not be empty")
              targets = [
                  {
                      "tag": item.get("tag"),
                      "target_sha": item.get("target_sha"),
                      "make_latest": False,
                  }
                  for item in releases
                  if isinstance(item, dict)
              ]
              if len(targets) != len(releases):
                  raise SystemExit("each release backfill entry must be an object")

          if len({item["tag"] for item in targets}) != len(targets):
              raise SystemExit("duplicate release backfill tag")
          print(json.dumps(targets, separators=(",", ":")))
          PY

          git fetch origin main --tags --force
          while IFS=$'\t' read -r release_tag target_sha make_latest; do
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid release tag: $release_tag" >&2
              exit 1
            fi
            if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "target_sha must be a full lowercase commit SHA" >&2
              exit 1
            fi

            git cat-file -e "${target_sha}^{commit}"
            git merge-base --is-ancestor "$target_sha" origin/main
            app_version="$({ git show "${target_sha}:quantmaster/release.py" || true; } \
              | sed -n 's/^VERSION = "\([^"]*\)"/\1/p' | head -n 1)"
            if [[ "$release_tag" != "v${app_version}" ]]; then
              echo "tag $release_tag does not match target version v${app_version}" >&2
              exit 1
            fi

            target_commit="$(git rev-parse "${target_sha}^{commit}")"
            if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
              tagged_commit="$(git rev-list -n 1 "$release_tag")"
              if [[ "$tagged_commit" != "$target_commit" ]]; then
                echo "immutable tag $release_tag already points to $tagged_commit" >&2
                exit 1
              fi
            else
              echo "required immutable tag $release_tag is missing; create it with the release operator" >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$release_tag" "$target_commit" "$make_latest" \
              >> "$normalized_file"
          done < <(
            python -c 'import json,sys; [print(x["tag"], x["target_sha"], str(x["make_latest"]).lower(), sep="\t") for x in json.load(open(sys.argv[1], encoding="utf-8"))]' "$targets_file"
          )

          targets="$(python -c 'import csv,json,sys; print(json.dumps([{"tag": r[0], "target_sha": r[1], "make_latest": r[2] == "true"} for r in csv.reader(open(sys.argv[1], encoding="utf-8"), delimiter="\t")], separators=(",", ":")))' "$normalized_file")"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
        platform:
          - os: windows-latest
            artifact: QuantMaster.exe
            asset: QuantMaster-windows.exe
          - os: macos-latest
            artifact: QuantMaster
            asset: QuantMaster-macos
          - os: ubuntu-latest
            artifact: QuantMaster
            asset: QuantMaster-linux
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin pyinstaller
          python -m pip install -e ".[data,tushare,rust]"
          if [[ -f rust/quantmaster-kernel/Cargo.lock ]]; then
            maturin build --manifest-path rust/quantmaster-kernel/Cargo.toml --release --locked --out dist/native
          else
            maturin build --manifest-path rust/quantmaster-kernel/Cargo.toml --release --out dist/native
          fi
          python -m pip install --no-index --find-links dist/native quantmaster-kernel
      - name: Verify native research kernel
        run: python -c "from quantmaster.research.kernel import kernel_capabilities; assert kernel_capabilities()['backend'] == 'rust'"
      - name: Verify tag matches application version
        shell: bash
        env:
          RELEASE_TAG: ${{ matrix.target.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(python -c 'from quantmaster import __version__; print(__version__)')"
      - name: Build
        working-directory: packaging
        run: pyinstaller quantmaster.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: mv "packaging/dist/${{ matrix.platform.artifact }}" "${{ matrix.platform.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.tag }}-${{ matrix.platform.asset }}
          path: ${{ matrix.platform.asset }}
          retention-days: 90
      - name: Attach to release
        if: matrix.target.make_latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.target.tag }}
          target_commitish: ${{ matrix.target.target_sha }}
          files: ${{ matrix.platform.asset }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          make_latest: ${{ matrix.target.make_latest }}
      - name: Record historical artifact handoff
        if: matrix.target.make_latest == false
        shell: bash
        run: |
          echo "::warning::${{ matrix.target.tag }} was built as a historical artifact; publishing its GitHub Release requires an operator token with Workflows permission."
          echo "### Historical artifact: ${{ matrix.target.tag }} / ${{ matrix.platform.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The verified binary is retained as workflow artifact \`${{ matrix.target.tag }}-${{ matrix.platform.asset }}\` for 90 days." >> "$GITHUB_STEP_SUMMARY"
