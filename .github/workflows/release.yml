name: Release Desktop Builds

permissions:
  contents: write

# 打 tag（如 v0.3.0）自动构建 Mac / Windows / Linux 三平台单文件可执行程序
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Historical tag to create or rebuild (for example v0.10.1)"
        required: false
        type: string
      target_sha:
        description: "Full historical commit SHA; must be an ancestor of main"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and create historical tag
        if: inputs.release_tag != '' || inputs.target_sha != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" || -z "$TARGET_SHA" ]]; then
            echo "release_tag and target_sha must be supplied together" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

          git fetch origin main --tags --force
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          app_version="$({ git show "${TARGET_SHA}:quantmaster/release.py" || true; } \
            | sed -n 's/^VERSION = "\([^"]*\)"/\1/p' | head -n 1)"
          if [[ "$RELEASE_TAG" != "v${app_version}" ]]; then
            echo "tag $RELEASE_TAG does not match target version v${app_version}" >&2
            exit 1
          fi

          target_commit="$(git rev-parse "${TARGET_SHA}^{commit}")"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_commit" != "$target_commit" ]]; then
              echo "immutable tag $RELEASE_TAG already points to $tagged_commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$target_commit"
            # GITHUB_TOKEN-created refs do not recursively trigger the tag workflow.
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: QuantMaster.exe
            asset: QuantMaster-windows.exe
          - os: macos-latest
            artifact: QuantMaster
            asset: QuantMaster-macos
          - os: ubuntu-latest
            artifact: QuantMaster
            asset: QuantMaster-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin pyinstaller
          python -m pip install -e ".[data,tushare,rust]"
          lock_args=()
          if [[ -f rust/quantmaster-kernel/Cargo.lock ]]; then
            lock_args+=(--locked)
          fi
          maturin build --manifest-path rust/quantmaster-kernel/Cargo.toml --release "${lock_args[@]}" --out dist/native
          python -m pip install --no-index --find-links dist/native quantmaster-kernel
      - name: Verify native research kernel
        run: python -c "from quantmaster.research.kernel import kernel_capabilities; assert kernel_capabilities()['backend'] == 'rust'"
      - name: Verify tag matches application version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(python -c 'from quantmaster import __version__; print(__version__)')"
      - name: Build
        working-directory: packaging
        run: pyinstaller quantmaster.spec --noconfirm
      - name: Rename artifact
        shell: bash
        run: mv "packaging/dist/${{ matrix.artifact }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.target_sha || github.sha }}
          files: ${{ matrix.asset }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          make_latest: ${{ inputs.release_tag != '' && 'false' || 'true' }}
