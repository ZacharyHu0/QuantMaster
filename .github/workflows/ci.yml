name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

env:
  UV_VERSION: "0.11.32"
  RUST_TOOLCHAIN: "1.94.0"

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
          enable-cache: true
      - name: Sync core environment
        run: uv sync --locked --extra dev
      - name: Cross-platform core tests
        shell: bash
        run: >-
          mkdir -p reports &&
          uv run python -m pytest tests/test_architecture.py tests/test_runtime_foundations.py
          tests/test_runtime_jobs.py tests/test_release_sync.py tests/test_settings.py
          --timeout=180
          --junitxml=reports/core-${{ matrix.os }}.xml
          --durations=30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: core-junit-${{ matrix.os }}
          path: reports/*.xml

  rust-quality:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
        with:
          components: rustfmt, clippy
      - run: |
          cargo fmt --manifest-path rust/quantmaster-kernel/Cargo.toml --check
          cargo check --manifest-path rust/quantmaster-kernel/Cargo.toml --locked
          cargo clippy --manifest-path rust/quantmaster-kernel/Cargo.toml --locked -- -D warnings
          cargo test --manifest-path rust/quantmaster-kernel/Cargo.toml --locked
      - name: Audit locked Rust dependencies
        working-directory: rust/quantmaster-kernel
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  native-parity:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
      - run: uv sync --locked --extra dev --extra rust
      - name: Bind PyO3 to the locked Python
        shell: bash
        run: echo "PYO3_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: uv run maturin build --manifest-path rust/quantmaster-kernel/Cargo.toml --release --locked --out dist/native
      - shell: bash
        run: uv pip install --no-index --find-links dist/native quantmaster-kernel
      - name: Native/Python parity smoke
        run: >-
          uv run python -m pytest --full
          tests/test_research_pipeline.py::test_rust_kernel_matches_python_when_extension_is_available
          --timeout=180 --durations=10

  coverage-shard:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
          enable-cache: true
      - name: Sync full test environment
        run: uv sync --locked --extra dev --extra quality --extra rust
      - name: Run full-suite shard
        run: >-
          mkdir -p reports &&
          uv run python -m coverage run --parallel-mode -m pytest
          --full
          --splits 3 --group ${{ matrix.shard }}
          --ignore=tests/test_ui_management.py
          --timeout=180
          --junitxml=reports/coverage-${{ matrix.shard }}.xml --durations=30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            .coverage.*
            reports/*.xml
          include-hidden-files: true

  coverage:
    timeout-minutes: 15
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
      - run: uv sync --locked --extra dev --extra quality
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Combine branch coverage
        run: |
          uv run python -m coverage combine
          uv run python -m coverage report
          uv run python -m coverage xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  browser:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      QM_RUN_UI: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra ui
      - run: uv run playwright install --with-deps chromium
      - name: Chromium management flows
        run: >-
          mkdir -p reports &&
          uv run python -m pytest tests/test_ui_management.py
          --timeout=180
          --junitxml=reports/browser.xml --durations=30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-junit
          path: reports/*.xml

  quality-package-audit:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.13"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17 # 1.94.0
      - run: uv sync --locked --extra dev --extra quality --extra rust --extra release --extra data --extra tushare
      - name: Python quality ratchets
        run: |
          uv run ruff check quantmaster tests tools
          uv run python tools/exception_policy.py
          uv run python tools/complexity_policy.py
          uv run mypy
      - name: Audit locked core dependencies
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --output-file core-requirements.txt
          uv run pip-audit --strict --require-hashes --disable-pip --requirement core-requirements.txt --vulnerability-service osv
      - name: Audit locked desktop dependency set
        shell: bash
        run: |
          uv export --locked --no-dev --extra data --extra tushare --extra rust --extra release --no-emit-project --output-file desktop-requirements.txt
          uv run pip-audit --strict --require-hashes --disable-pip --requirement desktop-requirements.txt --vulnerability-service osv
      - name: Build wheel and source distribution
        run: uv build
      - name: Fresh wheel and CLI doctor smoke
        shell: bash
        run: |
          python -m venv /tmp/quantmaster-wheel
          /tmp/quantmaster-wheel/bin/pip install dist/*.whl
          QM_CONFIG_PATH=/dev/null QM_DATA_ROOT="$(mktemp -d)" /tmp/quantmaster-wheel/bin/qm --help
          QM_CONFIG_PATH=/dev/null QM_DATA_ROOT="$(mktemp -d)" /tmp/quantmaster-wheel/bin/qm doctor --deep
      - name: PyInstaller smoke build
        working-directory: packaging
        shell: bash
        run: |
          uv run pyinstaller quantmaster.spec --noconfirm
          QM_CONFIG_PATH=/dev/null QM_DATA_ROOT="$(mktemp -d)" ./dist/QuantMaster --help
          QM_CONFIG_PATH=/dev/null QM_DATA_ROOT="$(mktemp -d)" ./dist/QuantMaster doctor --deep
