[package]
name = "quantmaster-kernel"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional numerical kernels for QuantMaster research"

[lib]
name = "_quantmaster_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
numpy = { version = "0.29", features = ["half"] }
ndarray = "0.17"
rayon = "1.10"
