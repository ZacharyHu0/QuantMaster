[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmaster"
dynamic = ["version"]
description = "面向 A 股的开源量化研究与实盘记录平台：多市场数据、因子研究与挖掘、AI 爬虫、回测/模拟盘、实盘账本"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "QuantMaster Contributors" }]
keywords = ["quant", "a-share", "backtest", "factor", "akshare", "llm"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "PyYAML>=6.0",
    "keyring>=25.0",
    "python-multipart>=0.0.9",
    "APScheduler>=3.11,<4",
    "lark-oapi>=1.7.1,<2",
    "qrcode>=8.0,<9",
    "rich>=14.0,<15",
]

[project.optional-dependencies]
# 免费数据源（推荐安装）
data = [
    "akshare>=1.18.81",
    "yfinance>=0.2.40",
]
# 可选数据源
tushare = ["tushare>=1.4"]
# AI Quant Lab：Ridge + MLP/TCN/GRU/Transformer/DAE（可选，核心安装保持轻量）
ml = [
    "scikit-learn>=1.3",
    "torch>=2.2",
    "optuna>=4.0,<5",
]
# 事件驱动回测引擎（可选，内置引擎为向量化）
backtrader = ["backtrader>=1.9"]
# 可选原生研究内核的本地构建工具；正式桌面包会预编译并内置扩展。
rust = ["maturin==1.14.1"]
dev = [
    "pytest>=8.0",
    "httpx2>=2.7,<3",
    "pytest-split>=0.10,<1",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.4",
    # The full test suite exercises Ridge and Spearman contracts even when the
    # heavyweight deep-learning extra is intentionally not installed.
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
quality = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "pip-audit==2.10.1",
]
ui = [
    "playwright>=1.46",
]
release = [
    "PyInstaller==6.19.0",
]

[project.scripts]
qm = "quantmaster.cli:main"

[tool.setuptools.packages.find]
include = ["quantmaster*"]

[tool.setuptools.package-data]
"quantmaster.server" = ["static/*"]
"quantmaster.data" = ["security_master.json.gz"]
"quantmaster.skills" = ["stock-analysis-framework/*"]

[tool.setuptools.dynamic]
version = {attr = "quantmaster.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:xonsh -p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["quantmaster"]
omit = [
    "*/quantmaster/fake_component.py",
    "quantmaster/server/static/*",
]

[tool.coverage.report]
fail_under = 69
show_missing = true
skip_covered = true
omit = ["*/quantmaster/fake_component.py"]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
show_error_codes = true
files = [
    "quantmaster/runtime",
    "quantmaster/lab",
    "quantmaster/data/base.py",
    "quantmaster/data/registry.py",
    "quantmaster/data/free_stockdb_source.py",
    "quantmaster/data/free_stockdb_runtime.py",
    "quantmaster/data/storage.py",
    "quantmaster/data/repair.py",
    "quantmaster/market/fear_greed.py",
    "quantmaster/server/security.py",
    "quantmaster/research/lake.py",
    "quantmaster/research/catalog.py",
    "quantmaster/portfolio/ledger.py",
    "quantmaster/doctor.py",
    "quantmaster/ai/news_claims.py",
    "quantmaster/ai/llm.py",
    "quantmaster/analysis/stock_evidence.py",
    "quantmaster/backtest/paper_accounts.py",
    "quantmaster/backtest/paper_automation.py",
    "quantmaster/automation/service.py",
    "quantmaster/rotation/service.py",
    "quantmaster/trading_sessions.py",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PIE", "RUF"]
# 数据源降级/爬虫容错场景大量使用宽 except，属有意设计
ignore = ["RUF001", "RUF002", "RUF003"]  # 全角标点误报（中文注释）

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.uv]
required-version = ">=0.11.0,<0.12"
